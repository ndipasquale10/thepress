name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Fast gate: money math and the static design-system audit. No dependencies,
  # so this stays a few seconds and its result is readable on its own.
  calc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run money-math and design-system regression tests
        run: npm test

  # Slower gate: drives a real browser through complete rounds. This is the only
  # check that can see a bug living in the seam between two screens.
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser download so only the first run after a Playwright
      # bump pays for it.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # A cache hit still needs the OS-level libraries Chromium links against.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Walk the app
        run: npm run test:flows
