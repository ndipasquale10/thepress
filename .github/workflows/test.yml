name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Fast gate: money math and the static design-system audit. No dependencies,
  # so this stays a few seconds and its result is readable on its own.
  calc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run money-math and design-system regression tests
        run: npm test

  # Slower gate: drives a real browser through complete rounds. This is the only
  # check that can see a bug living in the seam between two screens.
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately not cached. Caching the browser skips the ~66s download,
      # but a cache hit still needs the OS libraries Chromium links against,
      # and installing those alone costs ~100s -- so the cached path measured
      # slower than the uncached one (3m18s vs 2m37s). `--with-deps` does both
      # in one step and is the faster, simpler thing to run every time.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Walk the app
        run: npm run test:flows

  # Security gate: runs firestore.rules through the real rules engine in the
  # emulator. The money tests protect what the app computes; this protects who
  # is allowed to read it. A round holds names, scores and who owes whom, so
  # "can a stranger fetch this" belongs in CI and not in a console setting
  # nobody reviews.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test the security rules
        run: npm run test:rules
